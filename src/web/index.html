<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex" />
    <title>Grok RC</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="lock" class="lock">
      <div class="lock-card">
        <p class="mark">Grok RC</p>
        <h1>Open the link from your computer</h1>
        <p>The agent stays on that machine. This page is only the remote.</p>
      </div>
    </div>
    <div id="app" class="app mode-list" hidden>
      <aside class="rail">
        <header class="rail-head">
          <div>
            <p class="mark">Grok RC</p>
            <p id="hostLine" class="host-line">Connecting…</p>
          </div>
          <button id="newBtn" class="btn primary" type="button">New task</button>
          <button id="newMobile" class="btn primary new-mobile" type="button" aria-label="New task">+</button>
        </header>
        <div id="sessionList" class="session-list" role="list"></div>
        <footer class="rail-foot">
          <button id="pairBtn" class="btn ghost" type="button">Link a phone</button>
          <span id="linkState" class="link-state">Offline</span>
        </footer>
      </aside>
      <main class="main">
        <header class="chat-head">
          <button id="backBtn" class="btn icon back" type="button" aria-label="Sessions">‹</button>
          <div class="chat-title">
            <h1 id="title">Select a session</h1>
            <p id="subtitle"></p>
          </div>
          <button id="stopBtn" class="btn danger" type="button" hidden>Stop</button>
        </header>
        <div id="feed" class="feed"></div>
        <div id="queue" class="queue"></div>
        <form id="composer" class="composer">
          <div id="files" class="files"></div>
          <div class="composer-row">
            <label class="btn icon attach" title="Attach a photo">
              +
              <input id="file" type="file" accept="image/*" multiple hidden />
            </label>
            <textarea id="box" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
            <button id="sendBtn" class="btn primary send" type="submit">Send</button>
          </div>
        </form>
      </main>
    </div>
    <div id="sheet" class="sheet" hidden></div>
    <div id="perm" class="perm" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
